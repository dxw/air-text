name: CI

on:
  pull_request:
    branches:
      - master
  push:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Cache Docker images.
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('docker-compose.ci.yml') }}

      - name: Build
        run: script/ci/cibuild

      - name: Test
        run: script/ci/test
